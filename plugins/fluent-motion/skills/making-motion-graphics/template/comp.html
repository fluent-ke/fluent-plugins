<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Brand;src:url("fonts/Brand.ttf");font-weight:100 900}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script src="timeline.js"></script>
<canvas id="c"></canvas>
<script>
// ── The film. render(t) must be PURE: the same t always draws the same frame (no Date, no Math.random, no state
// carried between frames). Everything is authored in comp beats `b`; timeline.js maps them to music beats `m`.
const CONFIG={W:1080,H:1920,FPS:30,BPM:globalThis.BPM};               // 9:16. 1:1 → 1080×1080, 4:5 → 1080×1350, 16:9 → 1920×1080
const {W,H,FPS,BPM}=CONFIG,B=60/BPM,TAU=Math.PI*2;
const DUR=MUSIC_BEATS*B;window.CONFIG={...CONFIG,DUR};
const Q=new URLSearchParams(location.search);               // variants: render.mjs --query "day=TODAY"
const C={bg:'#101014',ink:'#FFFFFF',accent:'#46FF5E',brand:'#5B2A86',soft:'#D9C2FA'};   // take these from the brand assets
const cv=document.getElementById('c');cv.width=W;cv.height=H;

// ── Maths
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,k)=>a+(b-a)*k;
const E={outExpo:k=>k>=1?1:1-2**(-10*k),inExpo:k=>k<=0?0:2**(10*k-10),outCubic:k=>1-(1-k)**3,inOutCubic:k=>k<.5?4*k**3:1-(-2*k+2)**3/2,
  outQuint:k=>1-(1-k)**5,outBack:k=>{const c1=2,c3=c1+1;return 1+c3*(k-1)**3+c1*(k-1)**2},
  outElastic:k=>k<=0?0:k>=1?1:2**(-10*k)*Math.sin((k*10-.75)*TAU/3)+1};
const rng=s=>()=>((s=(s*16807)%2147483647)-1)/2147483646;   // seeded: use instead of Math.random
let b=0,m=0,t=0,ctx;
const PB=(a,z)=>clamp((b-a)/(z-a));                         // progress between two comp beats
const IN=(a,d=.5,e=E.outExpo)=>e(PB(a,a+d));                // eased entrance starting at beat a

// ── Assets. Put images in assets/ and name them here; they are decoded once before the first frame.
const IMG={};const SRC={/* logo:'assets/logo.png' */};
window.ready=Promise.all([document.fonts.load('800 50px Brand'),document.fonts.load('400 50px Brand'),
  ...Object.entries(SRC).map(([k,u])=>{const im=new Image();im.src=u;return im.decode().then(()=>IMG[k]=im)})]).then(()=>true);

// ── Footage: frame sequences from scripts/prep_footage.sh (shots/NAME/0001.jpg, optional masks/NAME/0001.png).
// `at` is the comp beat the shot starts; it plays in real time from there.
const SHOTS={/* HERO:{at:4,n:90,mask:false}   3D plate: PLATE:{at:0,n:300,ext:'png'} */};
const FR={},cache=new Map();
function load(u){if(!cache.has(u)){const im=new Image();im.src=u;cache.set(u,im.decode().then(()=>im,()=>null));if(cache.size>120)cache.delete(cache.keys().next().value)}return cache.get(u)}
const pad4=i=>String(i).padStart(4,'0');
const shotIdx=k=>clamp(Math.floor((t-toMusic(SHOTS[k].at)*B)*FPS),0,SHOTS[k].n-1)+1;
async function preload(){for(const k in SHOTS){const s=SHOTS[k];if(b<s.at-.1||t>toMusic(s.at)*B+s.n/FPS+.1)continue;const i=shotIdx(k);
  FR['f'+k]=await load(`shots/${k}/${pad4(i)}.${s.ext||'jpg'}`);if(s.mask)FR['m'+k]=await load(`masks/${k}/${pad4(i)}.png`)}}
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c},layer=mk(),lctx=layer.getContext('2d');
function plate(k,s=1,ox=0,oy=0){const im=FR['f'+k];if(!im)return;ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(s,s);ctx.drawImage(im,-W/2,-H/2,W,H);ctx.restore()}
// The subject cut out by its matte, same transform as plate(): draw plate, then text, then subject = text behind the person
function subject(k,s=1,ox=0,oy=0){const im=FR['f'+k],mm=FR['m'+k];if(!im||!mm)return;lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,W,H);
  lctx.drawImage(im,0,0,W,H);lctx.globalCompositeOperation='destination-in';lctx.drawImage(mm,0,0,W,H);lctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(s,s);ctx.drawImage(layer,-W/2,-H/2);ctx.restore()}

// ── Type
const font=(w,s)=>`${w} ${s}px Brand`;
function word(str,x,y,w,s,fill,{stroke=null,lw=4,alpha=1,sc=1,rot=0,track=0,align='center',blur=0,glow=null}={}){
  if(alpha<=0||sc<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  if(blur>.3)ctx.filter=`blur(${blur}px)`;if(glow){ctx.shadowColor=glow;ctx.shadowBlur=40}
  ctx.font=font(w,s);ctx.letterSpacing=track+'px';ctx.textAlign=align;ctx.textBaseline='middle';const ax=align==='center'?track/2:0;
  if(fill){ctx.fillStyle=fill;ctx.fillText(str,ax,0)}
  if(stroke){ctx.shadowBlur=0;ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.strokeText(str,ax,0)}ctx.restore()}
// Largest size (≤ maxS) at which str fits maxW
function fit(str,w,maxW,maxS,track=0){ctx.font=font(w,100);ctx.letterSpacing=track+'px';return Math.min(maxS,100*maxW/ctx.measureText(str).width)}
// Slam: outline echoes collapse into the filled word as spread → 0
function echo(str,x,y,w,s,fill,stroke,spread,alpha=1){
  for(let k=3;k>=1;k--)for(const d of[-1,1])word(str,x,y+d*k*spread,w,s,null,{stroke,lw:3,alpha:alpha*(1-k*.22)*clamp(spread/20)});
  word(str,x,y,w,s,fill,{alpha})}
// Rise: the line slides up out of a masked slot; k is 0→1 progress
function rise(str,x,y,w,s,fill,k,opt={}){ctx.save();ctx.beginPath();ctx.rect(0,y-s*.75,W,s*1.5);ctx.clip();
  word(str,x,y+(1-E.outExpo(k))*s*1.3,w,s,fill,opt);ctx.restore()}
function wrap(str,w,s,maxW){ctx.font=font(w,s);ctx.letterSpacing='0px';const out=[];let line='';
  for(const tk of str.split(' ')){const tr=line?line+' '+tk:tk;if(ctx.measureText(tr).width>maxW&&line){out.push(line);line=tk}else line=tr}out.push(line);return out}
function pill(txt,x,y,s,bg,fg,{sc=1,alpha=1,stroke=null,w8=700}={}){if(sc<=0||alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.scale(sc,sc);
  ctx.font=font(w8,s);ctx.letterSpacing='0px';const w=ctx.measureText(txt).width+s*1.9,h=s*2.2;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,h/2);
  if(bg){ctx.fillStyle=bg;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
  ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,s*.06);ctx.restore()}
function img(im,x,y,w,{alpha=1,sc=1,r=0,rot=0}={}){if(!im||alpha<=0||sc<=0)return 0;const h=w*im.height/im.width;ctx.save();ctx.globalAlpha=alpha;
  ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);if(r){ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,r);ctx.clip()}ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();return h}
// Caption / headline line: words pop in one after another on a spring. parts = [text, colour] pairs; words in C.accent are the
// key phrase and land with a bigger elastic pop and a brief warm glow. align 'center' centres the line on x, 'left' starts at x.
function words(parts,x,y,w,s,a,step,{track=-1,shadow=true,alpha=1,align='center'}={}){
  ctx.font=font(w,s);ctx.letterSpacing=track+'px';const toks=[];
  for(const[txt,col]of parts)for(const tk of txt.split(' ').filter(Boolean))toks.push([tk,col]);
  const sp=ctx.measureText(' ').width,ws=toks.map(([tk])=>ctx.measureText(tk).width),tot=ws.reduce((p,q)=>p+q,0)+sp*(toks.length-1);
  let cx=align==='center'?x-tot/2:x;toks.forEach(([tk,col],j)=>{const a0=a+j*step,k=PB(a0,a0+.5);if(k<=0){cx+=ws[j]+sp;return}
    const key=col===C.accent,sc=key?lerp(.55,1,E.outElastic(k)):lerp(.8,1,E.outBack(k)),dy=(1-E.outExpo(k))*s*.45;
    ctx.save();ctx.globalAlpha=alpha*clamp(k*3);ctx.translate(cx+ws[j]/2,y+dy);ctx.scale(sc,sc);
    if(shadow){ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=38}
    if(key){ctx.shadowColor=C.accent+'8C';ctx.shadowBlur=30*Math.exp(-(b-a0)*2)+(shadow?10:0)}
    ctx.font=font(w,s);ctx.letterSpacing=track+'px';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(tk,0,0);ctx.restore();cx+=ws[j]+sp})}
// Soft dark pool behind a text block over busy footage or a 3D plate: local and feathered, never a full-frame scrim
function halo(y,alpha,col='0,0,0'){if(alpha<=0)return;ctx.save();ctx.translate(W/2,y);ctx.scale(1,.42);const g=ctx.createRadialGradient(0,0,0,0,0,W*.62);
  g.addColorStop(0,`rgba(${col},${.8*alpha})`);g.addColorStop(.6,`rgba(${col},${.55*alpha})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(-W,-W,W*2,W*2);ctx.restore()}
// '#d97757' → '217,119,87' for rgba() strings
const rgbOf=h=>{const n=parseInt(h.slice(1,7),16);return `${n>>16},${n>>8&255},${n&255}`};
// Shockwave on an impact: a flash and two rings spreading from (x,y) from beat a, in colour col (hex)
function shock(x,y,a,{r=900,col=C.accent}={}){const k=PB(a,a+1.4);if(k<=0||k>=1)return;const e=E.outExpo(k),rgb=rgbOf(col);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const f=ctx.createRadialGradient(x,y,0,x,y,r*.9);f.addColorStop(0,`rgba(${rgb},${.45*(1-k)**2})`);f.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=f;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=`rgba(${rgb},${.9*(1-k)})`;ctx.lineWidth=18*(1-e)+2;ctx.beginPath();ctx.arc(x,y,r*e,0,TAU);ctx.stroke();
  ctx.strokeStyle=`rgba(255,255,255,${.5*(1-k)})`;ctx.lineWidth=4*(1-e)+1;ctx.beginPath();ctx.arc(x,y,r*.7*E.outExpo(PB(a+.05,a+1.4)),0,TAU);ctx.stroke();ctx.restore()}
// Seeded sparks thrown out from (x,y) at beat a, falling under gravity. Timed in real seconds, so stretched segments don't slow them.
function sparks(x,y,a,{n=26,seed=11,col=C.accent}={}){const el=t-toMusic(a)*B;if(el<0||el>1.6)return;const r=rng(seed),rgb=rgbOf(col);ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){const ang=r()*TAU,v=500+r()*900,sz=3+r()*6,px=x+Math.cos(ang)*v*el,py=y+Math.sin(ang)*v*el+500*el*el;
    ctx.fillStyle=`rgba(${r()<.7?rgb:'255,255,255'},${clamp(1-el/1.4)})`;ctx.beginPath();ctx.arc(px,py,sz*(1-el/1.8),0,TAU);ctx.fill()}ctx.restore()}
// Call to action: a filled button that pops in at beat a, gets tapped at beat tap (a press circle, a ripple, the button dips),
// and nudges its arrow. The arrow is drawn as a path, so it never depends on the font having a → glyph.
function cta(label,x,y,a,tap,{bg=C.accent,fg=C.bg,size=62,w8=800,minW=0}={}){const u=IN(a,.6,E.outBack);if(u<=0)return;
  ctx.font=font(w8,size);ctx.letterSpacing='-1px';const lw=ctx.measureText(label).width,aw=size*.8,gap=size*.45,bw=Math.max(minW,lw+aw+gap+size*1.6),bh=size*2.3;
  const d=b>tap?Math.exp(-(b-tap)*5)*Math.sin((b-tap)*18):0,sc=u*(1-.06*Math.max(0,d)),nud=size*.28*Math.max(0,Math.sin((b-a)*Math.PI));
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.shadowColor=bg+'8C';ctx.shadowBlur=60+20*Math.sin(b*3);ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,size*.26);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=fg;ctx.textAlign='left';ctx.textBaseline='middle';
  const x0=-(lw+gap+aw)/2;ctx.fillText(label,x0,size*.06);
  const ax=x0+lw+gap+nud,st=size*.11;ctx.strokeStyle=fg;ctx.lineWidth=st;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  ctx.moveTo(ax,0);ctx.lineTo(ax+aw,0);ctx.moveTo(ax+aw*.58,-aw*.4);ctx.lineTo(ax+aw,0);ctx.lineTo(ax+aw*.58,aw*.4);ctx.stroke();ctx.restore();
  const k=PB(tap-.2,tap+1);if(k>0&&k<1){const px=x+bw*.3,py=y+bh*.2,pr=E.outCubic(PB(tap-.2,tap));ctx.save();
    ctx.fillStyle=`rgba(255,255,255,${.85*(1-PB(tap+.1,tap+.6))})`;ctx.beginPath();ctx.arc(px,py,size*.75*pr,0,TAU);ctx.fill();
    ctx.strokeStyle=`rgba(255,255,255,${.8*(1-PB(tap,tap+1))})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(px,py,size*.75+size*3*E.outExpo(PB(tap,tap+1)),0,TAU);ctx.stroke();ctx.restore()}}
// Number that counts up from 0 between beats a and z (prices, prizes, stats)
const count=(n,a,z,fmt=v=>v.toLocaleString('en-US'))=>fmt(Math.round(n*E.outCubic(PB(a,z))));

// ── Backgrounds and texture
const grain=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),d=g.createImageData(256,256),r=rng(3);
  for(let i=0;i<d.data.length;i+=4){d.data[i]=d.data[i+1]=d.data[i+2]=r()*255;d.data[i+3]=16}g.putImageData(d,0,0);return c})();
function bgGlow(col=C.brand,x=W/2,y=H*.45){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.6);
  g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
const bgFlat=col=>{ctx.fillStyle=col;ctx.fillRect(0,0,W,H)};

// Scene cuts: a band wipes across (±0.4 music beat) and the scene changes underneath it.
// Keep CUTS equal to the scene end beats in scene() below: every `if(b<end)` except the last.
const CUTS=[4,8,12];
function swipe(){for(const c of CUTS){const k=(m-(toMusic(c)-.4))/.8;if(k<=0||k>=1)continue;const x=lerp(-W-900,W*2+900,E.inOutCubic(k));
  ctx.save();ctx.translate(x,H/2);ctx.rotate(-.35);ctx.fillStyle=C.accent;ctx.fillRect(-W*.4,-H,W*.8,H*2);ctx.restore()}}

// ── Scenes (example: replace with the storyboard). Each `if(b<end)` block is one scene.
function scene(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.shadowBlur=0;

  // S1 b0–4: one word per beat, colours flip each hit
  if(b<4){const i=Math.floor(b),k=b-i,cards=[['ONE',C.accent,C.bg],['WORD',C.brand,C.ink],['PER',C.soft,C.brand],['BEAT.',C.bg,C.accent]],[w,bg,fg]=cards[i];
    bgFlat(bg);const s=fit(w,800,W*.87,H*.2),sc=lerp(1.3,1,E.outExpo(clamp(k/.35)));
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-W/2,-H/2);echo(w,W/2,H/2,800,s,fg,fg,lerp(s*.9,0,E.outQuint(clamp(k/.6))));ctx.restore();return}

  // S2 b4–8: headline + subline + pills (a reading scene: stretch it in timeline.js)
  if(b<8){bgGlow();
    rise('The headline',W/2,H*.40,800,fit('The headline',800,W*.85,130),C.ink,PB(4.2,4.8));
    rise('A supporting line people read.',W/2,H*.40+120,400,48,C.soft,PB(4.6,5.1));
    ['Fact one','Fact two'].forEach((s,j)=>pill(s,W/2+(j?1:-1)*190,H*.58,40,j?C.accent:null,j?C.bg:C.ink,{sc:IN(5.5+j*.4,.45,E.outBack),stroke:j?null:C.soft}));
    return}

  // S3 b8–12: the number
  if(b<12){bgGlow(C.brand);const land=b>9.5?Math.exp(-(b-9.5)*6):0;
    word('$'+count(1000,8.2,9.5),W/2,H*.45,800,fit('$1,000',800,W*.8,300),C.ink,{sc:1+.12*land,glow:b>9.5?C.accent:null});
    rise('what the number means',W/2,H*.45+170,500,52,C.soft,PB(9.7,10.2));return}

  // S4 b12–16: end card (logo, name, call to action)
  bgGlow(C.brand,W/2,H*.4);
  echo('BRAND.',W/2,H*.38,800,fit('BRAND.',800,W*.8,200),C.ink,C.ink,lerp(90,0,E.outQuint(PB(12,12.6))));
  if(IMG.logo)img(IMG.logo,W/2,H*.62,W*.5,{alpha:IN(13,.6)});
  pill('The call to action',W/2,H*.8,40,C.accent,C.bg,{sc:IN(14,.5,E.outBack)});
}

function grainPass(){ctx.save();ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.translate((b*97)%256,(b*61)%256);ctx.fillRect(-256,-256,W+512,H+512);ctx.restore()}
async function render(time){await window.ready;t=time;m=t/B;b=toComp(m);ctx=cv.getContext('2d');await preload();
  scene();ctx.setTransform(1,0,0,1,0,0);swipe();grainPass();
  const end=SEG.at(-1)[1];if(b>end-.6){ctx.fillStyle=C.bg;ctx.globalAlpha=PB(end-.6,end);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
window.render=render;
</script></body></html>
